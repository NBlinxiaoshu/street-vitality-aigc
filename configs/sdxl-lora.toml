# Sanitized training configuration. Replace local paths before use.
model_train_type = "sdxl-lora"
pretrained_model_name_or_path = "/path/to/sd_xl_base_1.0.safetensors"
train_data_dir = "/path/to/train_data"
output_dir = "/path/to/output"
output_name = "XL-StreetOrder"

resolution = "1024,1024"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 2048
bucket_reso_steps = 32

save_model_as = "safetensors"
save_precision = "bf16"
save_every_n_epochs = 1
max_train_epochs = 16
train_batch_size = 2
gradient_checkpointing = true

network_module = "networks.lora"
network_dim = 128
network_alpha = 64
network_train_unet_only = true
network_train_text_encoder_only = false

learning_rate = 0.00013
unet_lr = 0.0002
text_encoder_lr = 0.00003 # Inactive because only UNet is trained.
lr_scheduler = "cosine"
lr_warmup_steps = 500
optimizer_type = "AdamW8bit"

caption_extension = ".txt"
shuffle_caption = true
keep_tokens = 0
max_token_length = 255

seed = 1337
mixed_precision = "bf16"
xformers = true
cache_latents = true
cache_latents_to_disk = true
persistent_data_loader_workers = true
log_with = "tensorboard"
logging_dir = "./logs"
